[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-ai-demo"
version = "0.1.0"
description = "A small, runnable demo of how Jev (TypeSafe's System One model) works"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jev_demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
